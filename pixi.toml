[workspace]
authors = ["GAI-313 <nakatogawagai@gmail.com>"]
channels = ["conda-forge", "robostack-staging"]
name = "humanoid_hackathon_env"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
verify-sdk = "python -c \"import cyclonedds, numpy, cv2, unitree_sdk2py; from unitree_sdk2py.core.channel import ChannelFactoryInitialize; print('unitree_sdk2py & cyclonedds loaded successfully!')\""
sample-tts = "python samples/sample_tts.py"
sample-walk = "python samples/sample_walk.py"
mock-robot = "python scripts/mock_robot.py"
generate-qrs = "python scripts/generate_test_qrs.py"
scan-qr = "python scripts/qr_scanner.py"
delivery-dryrun = "python scripts/qr_delivery_controller.py --dry-run"
delivery-mock = "python scripts/qr_delivery_controller.py --domain 1"
delivery-real = "python scripts/qr_delivery_controller.py --domain 0 -i Ethernet"
pick-move = "python scripts/pick_move.py"
test-pick-move = "python tests/test_pick_move.py"

[dependencies]
python = "3.10.*"
numpy = ">=1.26"
opencv = ">=4.8"

[pypi-dependencies]
cyclonedds = "==0.10.2"
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git" }
